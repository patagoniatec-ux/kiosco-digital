<!doctype html>

<head>

<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf1;color:#062743;font-family:Arial,Helvetica,sans-serif}main{max-width:1024px;margin:auto}.poster{position:relative;aspect-ratio:1024/1335;overflow:hidden}.poster>img{display:block;width:100%;height:auto}.service{position:absolute;background:transparent;border:2px solid transparent;border-radius:24px;cursor:pointer;transition:background .15s,border-color .15s}.service:hover{background:#ffffff24;border-color:#0c77596b}.service:focus-visible{outline:4px solid #08764e;outline-offset:-5px}.graphic{left:3.3%;top:47.1%;width:46%;height:13.5%}.model{left:51%;top:47.1%;width:46%;height:13.5%}.web{left:3.3%;top:61.8%;width:46%;height:13.9%}.docs{left:51%;top:61.8%;width:46%;height:13.9%}.print{left:3.3%;top:76.8%;width:93.5%;height:10.8%}.contact{text-align:center;padding:12px 20px 24px}.whatsapp{display:inline-flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#1bbd72,#07834b);box-shadow:0 5px 12px #075e3430,inset 0 2px 2px #8befb0;border:1px solid #15b46b;border-radius:50px;padding:20px 30px;color:white;text-decoration:none;font-size:clamp(17px,3vw,28px);font-weight:800}.whatsapp svg{width:37px;height:37px;flex-shrink:0}.whatsapp:hover{background:#087d49}.links{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:20px;margin-top:20px}.links a{color:#082b4a;text-decoration:none;font-weight:700;font-size:clamp(16px,2.5vw,24px)}.links a:hover{text-decoration:underline}.links span{background:#dceff8;border-radius:50%;padding:9px;display:inline-block;margin-right:8px}.tagline{font-size:18px;margin:18px 0 0}.hint{font-size:12px;color:#526659;margin:14px 0 0}a:focus-visible,button:focus-visible{outline:3px solid #ed8955;outline-offset:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{border:0;border-radius:22px;width:min(480px,calc(100% - 32px));padding:30px;background:#fffaf1;color:#082b4a;box-shadow:0 20px 80px #09253d44}dialog::backdrop{background:#082b4a9c}dialog h2{font-size:27px;line-height:1.15;margin:14px 28px 18px 0}dialog p{font-size:17px;line-height:1.65}dialog .whatsapp{font-size:17px;padding:15px 20px;margin-top:10px}.close{position:absolute;right:14px;top:10px;border:0;background:none;font-size:30px;color:#082b4a;cursor:pointer;padding:5px 10px}@media(max-width:560px){.contact{padding:12px 14px 26px}.links{gap:12px;flex-direction:column}.whatsapp{padding:16px 20px;gap:9px}.whatsapp svg{width:28px;height:28px}.tagline{font-size:15px}.service{border-radius:12px}}@media(prefers-reduced-motion:reduce){.service{transition:none}}
</style>
</head>
<body>
<main>
<h1 class="sr-only">Kiosco Digital Coworking. Vos traés la idea. Juntos la hacemos archivo.</h1>
<div class="poster">
<img src="./Imagen%20de%20ChatGPT%2020%20oct%202026%2C%2006_45_01%20p.m.png" width="1024" height="1536" alt="Kiosco Digital: preparamos tu archivo listo para usar, con atención personal y ayuda de IA. Afiches, invitaciones y carruseles; diseño y archivos 3D; pequeños sitios web; documentos personalizados. También podés consultar por impresión en papel o 3D. Atención de 18 a 22 h. Acordamos el plazo al revisar el pedido e incluimos una ronda de cambios." fetchpriority="high">
<button class="service graphic" data-service="graphic" aria-label="Más información sobre afiches, invitaciones y carruseles" aria-haspopup="dialog"></button>
<button class="service model" data-service="model" aria-label="Más información sobre diseño y archivos 3D" aria-haspopup="dialog"></button>
<button class="service web" data-service="web" aria-label="Más información sobre pequeños sitios web" aria-haspopup="dialog"></button>
<button class="service docs" data-service="docs" aria-label="Más información sobre documentos personalizados" aria-haspopup="dialog"></button>
<button class="service print" data-service="print" aria-label="Consultar opciones de impresión en papel o 3D" aria-haspopup="dialog"></button>
</div>
<section class="contact" aria-label="Contacto">
<a class="whatsapp" href="https://wa.me/5492984881253?text=Hola%2C%20quiero%20consultar%20por%20un%20proyecto%20para%20Kiosco%20Digital." target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M27 15.5a11.5 11.5 0 0 1-17 10L4 27l1.5-6a11.5 11.5 0 1 1 21.5-5.5Z"/><path d="M11 9c-4 4 6 14 10 10l-3-3-2 1c-2-1-3-2-4-4l1-2Z"/></svg>Contame tu idea por WhatsApp</a>
<div class="links"><a href="https://wa.me/5492984881253" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">☎</span>298 4881253</a><a href="mailto:patagoniatec@gmail.com"><span aria-hidden="true">✉</span>patagoniatec@gmail.com</a></div>
<p class="tagline">Pedidos simples. Soluciones prácticas.</p><p class="hint">Tocá los recuadros de servicios para conocer más.</p>
</section>
</main>
<dialog id="service-dialog" aria-labelledby="service-title"><button class="close" type="button" aria-label="Cerrar información">×</button><h2 id="service-title"></h2><p id="service-description"></p><a class="whatsapp" id="service-contact" target="_blank" rel="noopener noreferrer">Consultar por WhatsApp ↗</a></dialog>
<script>
const services={
graphic:{title:'Afiches, invitaciones y carruseles',description:'Diseños para compartir y promocionar. Podemos preparar un afiche, una invitación digital o un carrusel para Instagram. Contanos el motivo, los textos y dónde lo vas a publicar.'},
model:{title:'Diseño y archivos 3D',description:'Nombres, letras y piezas sencillas. Mandanos una referencia, las medidas y el uso que necesitás para evaluar el diseño y preparar el archivo para impresión 3D.'},
web:{title:'Pequeños sitios web',description:'Tu emprendimiento en una página. Presentamos tus servicios, imágenes y datos de contacto en un sitio que podés compartir con tus clientes.'},
docs:{title:'Documentos personalizados',description:'Diplomas, certificados y planillas. Contanos el formato que necesitás y enviá los datos o textos para preparar tu archivo listo para usar.'},
print:{title:'¿También necesitás imprimirlo?',description:'Consultá por opciones de impresión en papel o 3D. Indicá las medidas, el material o tipo de papel y la cantidad para revisar las alternativas.'}
};
const modal=document.getElementById('service-dialog');
document.querySelectorAll('[data-service]').forEach(button=>button.addEventListener('click',()=>{
const service=services[button.dataset.service];
document.getElementById('service-title').textContent=service.title;
document.getElementById('service-description').textContent=service.description;
document.getElementById('service-contact').href='https://wa.me/5492984881253?text='+encodeURIComponent('Hola, quiero consultar por '+service.title.toLowerCase()+'.');
modal.showModal();
}));
document.querySelector('.close').addEventListener('click',()=>modal.close());
modal.addEventListener('click',event=>{if(event.target===modal){const bounds=modal.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)modal.close();}});
</script>
</body>
</html>
